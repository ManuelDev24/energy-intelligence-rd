[project]
name = "energy-api"
version = "0.1.0"
description = "Energy RD API (FastAPI + PostgreSQL)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "argon2-cffi>=23.1,<26",
    "PyJWT>=2.10.1,<3",
    "email-validator>=2.2,<3",
    # ERD-AUTH-05: cliente HTTP del backend de correo Resend (también lo usa TestClient en dev).
    "httpx>=0.27,<1",
    # ERD-OCR-01: subida de foto de factura (multipart) + OCR local (sin SaaS, sin costo por página).
    "python-multipart>=0.0.9,<1",
    "pillow>=10.3,<12",
    "pytesseract>=0.3.10,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
