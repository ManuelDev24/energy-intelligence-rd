name: CI

on:
  pull_request:
    branches: [Dev, QA, main]
  push:
    branches: [Dev, QA, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Auditoría C-11: el GITHUB_TOKEN de este workflow solo lee el repositorio (ningún job publica ni escribe nada).
# Las acciones están fijadas por SHA de commit (el comentario indica la etiqueta); Dependabot las actualiza.
permissions:
  contents: read

jobs:
  api:
    name: api (pytest + migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: energy_rd
          POSTGRES_USER: energy
          POSTGRES_PASSWORD: change_me_local_only
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U energy -d energy_rd"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    env:
      # Auditoría C-03: la API arranca con autenticación encendida; la suite y las migraciones usan el modo piloto explícito.
      ENVIRONMENT: development
      AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Instalar motor OCR e idiomas
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng
          tesseract --version
          tesseract --list-langs
      - run: uv sync --frozen
      # Auditoría C-17: lint (errores reales) y tipado gradual de los módulos listados en pyproject.toml.
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run python -m scripts.generate_contracts --check
      - run: python scripts/check_architecture.py
        working-directory: .
      - run: python scripts/check_workflow_pins.py
        working-directory: .
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade -1 && uv run alembic upgrade head
      - run: uv run python -m app.seed && uv run python -m app.seed
      # Cobertura de líneas y ramas (informe en el log; el umbral mínimo se fija en pyproject.toml cuando haya medición estable).
      - run: uv run pytest -q --cov=app --cov-report=term:skip-covered
      # Auditoría C-01: la misma suite (las pruebas con autenticación) con el API conectado como `erd_app`, un rol sin privilegios sujeto a la RLS.
      - run: uv run pytest -q
        env:
          TEST_RLS_ROLE: "1"

  web-mobile:
    name: web + mobile + core (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint --workspace apps/web
      - run: npm test
      - run: npm run test --workspace apps/admin
      - run: npm run e2e:safety --workspace apps/admin
      - run: npm run build --workspace apps/admin
        env:
          ADMIN_API_BASE_URL: https://api.example.invalid
          ADMIN_ORIGIN: https://admin.example.invalid
      # Producción exige auth activa y orígenes HTTPS (next.config.mjs falla cerrado sin ellos).
      # Valores de marcador solo para compilar; no apuntan a ningún servicio real.
      - run: npm run build --workspace apps/web
        env:
          NEXT_PUBLIC_AUTH_ENABLED: "true"
          API_BASE_URL: https://api.example.invalid
          WEB_ORIGIN: https://app.example.invalid

  e2e-web:
    name: e2e web (Playwright vs PostgreSQL + API + worker reales)
    runs-on: ubuntu-latest
    needs: [api]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: energy_rd
          POSTGRES_USER: energy
          POSTGRES_PASSWORD: change_me_local_only
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U energy -d energy_rd"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      # Base EXCLUSIVA de las pruebas (`_e2e`): la guarda de e2e_prepare rechaza cualquier otro nombre.
      E2E_DATABASE_URL: postgresql+psycopg://energy:change_me_local_only@localhost:5433/energy_rd_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Instalar motor OCR e idiomas
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng
      - run: uv sync --frozen
        working-directory: services/api
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Playwright (base, API, worker y web se levantan y se apagan solos)
        run: npm run e2e --workspace apps/web
      - name: Depurar evidencias (sin tokens, cookies, contraseñas ni correos; sin videos)
        if: failure()
        run: python3 scripts/scrub_e2e_artifacts.py apps/web/e2e/.results apps/web/e2e/.report apps/web/e2e/.tmp
      - name: Publicar diagnósticos (solo si falló)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-web-diagnostics
          path: |
            apps/web/e2e/.results
            apps/web/e2e/.report
            apps/web/e2e/.tmp/*.log
          retention-days: 7
          if-no-files-found: ignore

  mobile-e2e:
    name: web + mobile (recorridos vs API real)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: energy_rd
          POSTGRES_USER: energy
          POSTGRES_PASSWORD: change_me_local_only
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U energy -d energy_rd"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # Los servidores se lanzan desde .venv (no con `uv run`): un `uv` vivo en segundo plano
      # retiene el lock de caché y `uv cache prune` del post-job agota su timeout (exit 2).
      - name: API piloto (:8000, sin auth) migrada y sembrada
        working-directory: services/api
        env:
          ENVIRONMENT: development
          AUTH_ENABLED: "false"
        run: |
          uv sync --frozen
          .venv/bin/alembic upgrade head
          .venv/bin/python -m app.seed
          nohup .venv/bin/uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
          curl --fail http://localhost:8000/health
      - name: API de integración (:8011, con auth) en BD dedicada
        working-directory: services/api
        env:
          PGPASSWORD: change_me_local_only
        run: |
          psql -h localhost -p 5433 -U energy -d energy_rd -c 'CREATE DATABASE energy_rd_auth_ci'
          export DATABASE_URL=postgresql+psycopg://energy:change_me_local_only@localhost:5433/energy_rd_auth_ci
          export AUTH_ENABLED=true
          export AUTH_SIGNING_KEY="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$AUTH_SIGNING_KEY"
          .venv/bin/alembic upgrade head
          nohup .venv/bin/uvicorn app.main:app --port 8011 > /tmp/api-auth.log 2>&1 &
          echo $! > /tmp/api-auth.pid
          for i in $(seq 1 30); do curl -sf http://localhost:8011/health && break; sleep 1; done
          curl --fail http://localhost:8011/health
      - run: npm ci
      - name: Web contra API real (sin omisiones)
        env:
          LIVE_API_URL: http://localhost:8000
        run: npm run test --workspace apps/web
      - name: Recorridos móviles (piloto, auth y Fase 2)
        env:
          MOBILE_E2E_API_URL: http://localhost:8000
          AUTH_E2E_API_URL: http://localhost:8011
          # Sin PHASE2_PILOT_PROBE_URL: esa sonda exige la API piloto ANTIGUA (sin Fase 2);
          # aquí :8000 corre el código actual, que sí tiene Fase 2. Se ejecuta solo en local.
        run: npx vitest run src/e2e
        working-directory: apps/mobile
      - if: failure()
        run: cat /tmp/api.log /tmp/api-auth.log
      - name: Detener APIs
        if: always()
        run: |
          for f in /tmp/api.pid /tmp/api-auth.pid; do
            [ -f "$f" ] && kill "$(cat "$f")" 2>/dev/null || true
          done
