name: CI

on:
  pull_request:
    branches: [Dev, QA, main]
  push:
    branches: [Dev, QA, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (pytest + migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: energy_rd
          POSTGRES_USER: energy
          POSTGRES_PASSWORD: change_me_local_only
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U energy -d energy_rd"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python -m scripts.generate_contracts --check
      - run: python scripts/check_architecture.py
        working-directory: .
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade -1 && uv run alembic upgrade head
      - run: uv run python -m app.seed && uv run python -m app.seed
      - run: uv run pytest -q

  web-mobile:
    name: web + mobile + core (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint --workspace apps/web
      - run: npm test
      # Producción exige auth activa y orígenes HTTPS (next.config.mjs falla cerrado sin ellos).
      # Valores de marcador solo para compilar; no apuntan a ningún servicio real.
      - run: npm run build --workspace apps/web
        env:
          NEXT_PUBLIC_AUTH_ENABLED: "true"
          API_BASE_URL: https://api.example.invalid
          WEB_ORIGIN: https://app.example.invalid

  mobile-e2e:
    name: web + mobile (recorridos vs API real)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: energy_rd
          POSTGRES_USER: energy
          POSTGRES_PASSWORD: change_me_local_only
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U energy -d energy_rd"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: API migrada y sembrada
        working-directory: services/api
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          uv run python -m app.seed
          nohup uv run uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
          curl --fail http://localhost:8000/health
      - run: npm ci
      - name: Web contra API real (sin omisiones)
        env:
          LIVE_API_URL: http://localhost:8000
        run: npm run test --workspace apps/web
      - name: Recorrido vivienda → factura → dashboard → alerta
        env:
          MOBILE_E2E_API_URL: http://localhost:8000
        run: npx vitest run src/e2e
        working-directory: apps/mobile
      - if: failure()
        run: cat /tmp/api.log
