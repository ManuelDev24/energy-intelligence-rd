name: Dependency monitor

# ERD-SEC-DEPS-MONITOR: vigila los avisos altos aceptados (docs/security/accepted-advisories.json) y audita la API.
# No ejecuta `npm audit fix` ni `--force`: solo informa y falla cuando hace falta una decisión.
on:
  schedule:
    - cron: '17 11 * * 1'   # lunes, 11:17 UTC
  workflow_dispatch:
  pull_request:
    paths: ['package-lock.json', 'package.json', 'services/api/uv.lock', 'services/api/pyproject.toml',
            'docs/security/accepted-advisories.json', 'scripts/audit-monitor*']

permissions:
  contents: read

jobs:
  npm:
    name: npm (avisos aceptados, vigencia y parches)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm run test:scripts
      - run: npm run audit:monitor

  api:
    name: api (pip-audit sobre uv.lock)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv export --frozen --no-hashes --no-emit-project > /tmp/requirements.txt
      - run: uvx pip-audit -r /tmp/requirements.txt --no-deps --disable-pip
