services:
  postgres:
    image: postgres:16-alpine
    container_name: energy-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-energy_rd}
      POSTGRES_USER: ${POSTGRES_USER:-energy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: energy-rd-api:local
    build: ./backend/api
    container_name: energy-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-energy}:${POSTGRES_PASSWORD:-change_me_local_only}@postgres:5432/${POSTGRES_DB:-energy_rd}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8081,http://localhost:19006}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Auditoría C-03: la API arranca con autenticación ENCENDIDA. Este compose es de desarrollo: el modo piloto local (sin cuentas)
      # se pide aquí de forma explícita; para probar cuentas use AUTH_ENABLED=true y un AUTH_SIGNING_KEY aleatorio.
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY:-}
      SEED_PILOT: ${SEED_PILOT:-false}
      MIGRATE_ON_START: ${MIGRATE_ON_START:-true}
    ports:
      - '${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: energy-rd-api:local
    build: ./backend/api
    profiles: ["ops"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-energy}:${POSTGRES_PASSWORD:-change_me_local_only}@postgres:5432/${POSTGRES_DB:-energy_rd}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Auditoría C-03: la API arranca con autenticación ENCENDIDA. Este compose es de desarrollo: el modo piloto local (sin cuentas)
      # se pide aquí de forma explícita; para probar cuentas use AUTH_ENABLED=true y un AUTH_SIGNING_KEY aleatorio.
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SEED_PILOT: "false"
      MIGRATE_ON_START: "false"
    entrypoint: ["alembic", "upgrade", "head"]

  # ERD-WORKER-01: ejecuta los trabajos en segundo plano (OCR de originales, mantenimiento). La cola vive en
  # PostgreSQL (docs/ops/JOBS.md). No arranca por defecto:  docker compose --profile jobs up -d worker
  # Sin STORAGE_* el OCR asíncrono responde 503 (el almacenamiento está deshabilitado); ver backend/api/STORAGE.md.
  # La sintaxis se validó con `docker compose --profile jobs config`; NO se levantó (no hay daemon de Docker en este entorno).
  worker:
    image: energy-rd-api:local
    build: ./backend/api
    container_name: energy-worker
    profiles: ["jobs"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-energy}:${POSTGRES_PASSWORD:-change_me_local_only}@postgres:5432/${POSTGRES_DB:-energy_rd}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Auditoría C-03: la API arranca con autenticación ENCENDIDA. Este compose es de desarrollo: el modo piloto local (sin cuentas)
      # se pide aquí de forma explícita; para probar cuentas use AUTH_ENABLED=true y un AUTH_SIGNING_KEY aleatorio.
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SEED_PILOT: "false"
      MIGRATE_ON_START: "false"
      STORAGE_BACKEND: ${STORAGE_BACKEND:-disabled}
      STORAGE_ENCRYPTION_KEYS: ${STORAGE_ENCRYPTION_KEYS:-}
      STORAGE_URL_SIGNING_KEY: ${STORAGE_URL_SIGNING_KEY:-}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_ENDPOINT_URL: ${STORAGE_S3_ENDPOINT_URL:-}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
    entrypoint: ["./docker-entrypoint.sh", "python", "-m", "app.worker"]

  # Sin uso: la cola de trabajos está en PostgreSQL (ERD-WORKER-01). Se conserva por si el volumen exige Redis más adelante.
  #   docker compose --profile jobs up -d redis
  redis:
    image: redis:7-alpine
    container_name: energy-redis
    profiles: ["jobs"]
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
