# Etiquetas REAL/ESTIMADO/PROYECTADO y ausencia de datos horarios en las 5 viviendas (app ya en onboarding completado).
appId: ${APP_ID || 'host.exp.Exponent'}
---
- launchApp:
    stopApp: true
- openLink: ${EXPO_URL || 'exp://127.0.0.1:8081'}
- extendedWaitUntil:
    visible: "(Development servers|Inicio)"
    timeout: 120000
# Android: a veces Expo Go se queda en su inicio en vez de abrir el enlace.
- runFlow:
    when:
      visible: "Development servers"
    commands:
      - tapOn: "exp://.*:8081"
- extendedWaitUntil:
    visible:
      id: "tab-Dashboard"
    timeout: 120000

# ---- PILOT-01 ----
- tapOn:
    id: "tab-Dashboard"
- tapOn:
    id: "home-switcher"
- extendedWaitUntil:
    visible:
      id: "home-PILOT-01"
    timeout: 20000
- tapOn:
    id: "home-PILOT-01"
- extendedWaitUntil:
    visible: "Vivienda piloto 01.*"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "hero"
    timeout: 20000
- assertVisible:
    id: "badge-PROJECTED"
- assertNotVisible: ".*(por hora|kWh/h|PROJECTED|ESTIMATED).*"
- takeScreenshot: evidence/labels-PILOT-01-top
- scrollUntilVisible:
    element:
      id: "badge-ESTIMATED"
    timeout: 20000
- takeScreenshot: evidence/labels-PILOT-01-estimated
- scrollUntilVisible:
    element:
      id: "monthly-note"
    timeout: 20000
- assertVisible: ".*Resolución mensual: sin datos horarios.*"
# La leyenda conserva su estado al cambiar de vivienda: abrirla solo si está cerrada.
- runFlow:
    when:
      notVisible: ".*Ocultar.*"
    commands:
      - tapOn:
          id: "monthly-note"
- scrollUntilVisible:
    element:
      id: "badge-REAL"
    timeout: 10000
- takeScreenshot: evidence/labels-PILOT-01-legend
- scrollUntilVisible:
    element:
      id: "hero"
    direction: UP
    timeout: 20000

