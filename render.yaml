# Energy RD — Render Blueprint, PILOTO GRATUITO (plan: docs/deploy/VERCEL_PLAN.md)
#
# Solo el backend vive en Render: web y admin van en Vercel; la base, en Neon (us-east-2 → región Render «ohio»).
# Un único servicio web Free con Docker que arranca la API y, dentro del mismo contenedor, el worker
# (RUN_WORKER_IN_WEB; Render no ofrece workers gratuitos). Limitaciones del plan Free: se duerme tras 15 min sin tráfico
# (~1 min en despertar), 512 MB de RAM, 750 h/mes por workspace, sin preDeployCommand.
#
# Migraciones: NO corren aquí (MIGRATE_ON_START está prohibido fuera de desarrollo y Free no admite preDeployCommand).
# Se ejecutan desde la máquina de la persona dueña con el rol dueño de Neon:
#   cd backend/api && MIGRATION_DATABASE_URL=… uv run alembic upgrade head
# El rol dueño (MIGRATION_DATABASE_URL) nunca se carga en Render.
#
# Secretos y URLs: SIEMPRE `sync: false` (Render los pide al crear el Blueprint y luego los ignora). Ningún valor real aquí.

services:
  - type: web
    name: energyrd-api
    runtime: docker
    plan: free
    region: ohio
    branch: Dev
    dockerfilePath: ./backend/api/Dockerfile
    dockerContext: ./backend/api
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/api/**
    envVars:
      # Piloto: «staging» (no «production»): los textos legales siguen en borrador y la API de producción no arranca con ellos.
      - key: ENVIRONMENT
        value: staging
      - key: AUTH_ENABLED
        value: "true"
      # Auditoría C-01: API como erd_app, worker como erd_worker (docs/ops/DB_ROLES.md); el arranque falla con un rol privilegiado.
      - key: DB_REQUIRE_RESTRICTED_ROLE
        value: "true"
      - key: MIGRATE_ON_START
        value: "false"
      - key: SEED_PILOT
        value: "false"
      # Dos procesos (API + worker) comparten 512 MB y el límite de conexiones de Neon Free: pool pequeño.
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DB_POOL_TIMEOUT
        value: "10"
      - key: RUN_WORKER_IN_WEB
        value: "true"
      - key: EMAIL_BACKEND
        value: resend
      - key: DATABASE_URL # Neon, rol erd_app, endpoint con pooler: postgresql+psycopg://erd_app:…@…-pooler…neon.tech/…?sslmode=require
        sync: false
      - key: WORKER_DATABASE_URL # Neon, rol erd_worker (credenciales distintas de las del API)
        sync: false
      - key: AUTH_SIGNING_KEY # ≥43 caracteres aleatorios
        sync: false
      - key: CORS_ORIGINS # https://<web>.vercel.app,https://<admin>.vercel.app
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM # p. ej. "Energy RD <no-reply@TU-DOMINIO>" (dominio verificado en Resend)
        sync: false
      - key: PASSWORD_RESET_URL # https://<web>.vercel.app/restablecer-contrasena
        sync: false
      - key: EXPO_ACCESS_TOKEN # opcional: avisos push; vacío = sin token
        sync: false
      # Originales de factura: «disabled» (registro manual, sin OCR) o «s3» con un bucket privado (p. ej. Backblaze B2 gratuito).
      - key: STORAGE_BACKEND
        sync: false
      - key: STORAGE_S3_BUCKET
        sync: false
      - key: STORAGE_S3_ENDPOINT_URL # B2: https://s3.<región>.backblazeb2.com
        sync: false
      - key: STORAGE_S3_REGION # B2: la región del bucket, p. ej. us-east-005
        sync: false
      - key: STORAGE_S3_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_ENCRYPTION_KEYS # "id:clave" (base64url de 32 bytes); ver backend/api/STORAGE.md
        sync: false
      - key: STORAGE_URL_SIGNING_KEY # ≥43 caracteres aleatorios
        sync: false
