# Energy RD — Render Blueprint (ERD-DEPLOY-01)
# Guía paso a paso: docs/deploy/DEPLOY_GUIDE.md · Variables: docs/deploy/ENV_CHECKLIST.md
#
# Un proyecto con dos entornos:
#   staging    → rama Dev,  instancias Free (duermen tras 15 min sin tráfico), auto-deploy por commit.
#   production → rama main, instancias Starter, auto-deploy APAGADO (deploy manual), migración
#                como paso único de release (preDeployCommand). Render solo permite preDeployCommand
#                en servicios de pago: en staging la migración se ejecuta a mano (ver la guía).
#
# Secretos: SIEMPRE `sync: false` (Render los pide solo al crear el Blueprint y luego los ignora
# en cada sincronización). Ningún valor real vive en este archivo.
# Las URLs públicas también son `sync: false`: dependen del subdominio que asigne Render o del
# dominio propio, y no deben revertirse en cada sincronización del Blueprint.

previews:
  generation: "off"

projects:
  - name: energy-rd
    environments:
      # ------------------------------------------------------------------ STAGING
      - name: staging
        envVarGroups:
          - name: energyrd-api-staging-config
            envVars:
              - key: ENVIRONMENT
                value: staging
              - key: AUTH_ENABLED
                value: "true"
              - key: MIGRATE_ON_START
                value: "false"
              - key: SEED_PILOT
                value: "false"
              - key: DB_POOL_SIZE
                value: "5"
              - key: DB_MAX_OVERFLOW
                value: "5"
              - key: DB_POOL_TIMEOUT
                value: "10"
              # Recuperación de contraseña (variables leídas por la API cuando se integre ese trabajo).
              - key: EMAIL_BACKEND
                value: resend
              # ERD-STORE-01 / ERD-WORKER-01: originales de factura cifrados en un bucket S3-compatible PRIVADO.
              # Los secretos y el bucket van en cada servicio (sync: false); aquí solo lo no secreto.
              - key: STORAGE_BACKEND
                value: s3
        services:
          - type: web
            name: energyrd-api-staging
            runtime: docker
            plan: free
            region: virginia
            branch: Dev
            dockerfilePath: ./services/api/Dockerfile
            dockerContext: ./services/api
            healthCheckPath: /health
            autoDeployTrigger: commit
            buildFilter:
              paths:
                - services/api/**
            envVars:
              - fromGroup: energyrd-api-staging-config
              - key: DATABASE_URL # Neon, rama `staging`: postgresql+psycopg://…?sslmode=require
                sync: false
              - key: AUTH_SIGNING_KEY # ≥43 caracteres aleatorios; distinta de producción
                sync: false
              - key: CORS_ORIGINS # https://<web-staging>.onrender.com
                sync: false
              - key: RESEND_API_KEY
                sync: false
              - key: EMAIL_FROM # p. ej. "Energy RD <no-reply@staging.TU-DOMINIO>"
                sync: false
              - key: PASSWORD_RESET_URL # https://<web-staging>.onrender.com/<ruta de restablecimiento>
                sync: false
              - key: STORAGE_S3_BUCKET
                sync: false
              - key: STORAGE_S3_ENDPOINT_URL # vacío = AWS S3; Cloudflare R2: https://<cuenta>.r2.cloudflarestorage.com
                sync: false
              - key: STORAGE_S3_ACCESS_KEY_ID
                sync: false
              - key: STORAGE_S3_SECRET_ACCESS_KEY
                sync: false
              - key: STORAGE_ENCRYPTION_KEYS # "id:clave" (base64url de 32 bytes); ver services/api/STORAGE.md
                sync: false
              - key: STORAGE_URL_SIGNING_KEY # ≥43 caracteres aleatorios
                sync: false

          - type: web
            name: energyrd-web-staging
            runtime: node
            plan: free
            region: virginia
            branch: Dev
            # Monorepo npm workspaces: se instala desde la raíz con el único package-lock.json.
            buildCommand: npm ci --include=dev && npm run build --workspace apps/web
            startCommand: npm run start --workspace apps/web
            healthCheckPath: /login
            autoDeployTrigger: commit
            buildFilter:
              paths:
                - apps/web/**
                - packages/**
                - package.json
                - package-lock.json
            envVars:
              - key: NODE_VERSION
                value: "24"
              - key: NEXT_TELEMETRY_DISABLED
                value: "1"
              - key: NEXT_PUBLIC_AUTH_ENABLED # se incrusta en build: cambiarla exige redeploy
                value: "true"
              - key: API_BASE_URL # https://<api-staging>.onrender.com (origen, sin ruta)
                sync: false
              - key: WEB_ORIGIN # https://<web-staging>.onrender.com (origen, sin ruta)
                sync: false

          # ERD-WORKER-01: ejecuta los trabajos en segundo plano (OCR de originales, anomalías, alertas y avisos,
          # mantenimiento). La cola vive en PostgreSQL: mismo DATABASE_URL que la API. Docs: docs/ops/JOBS.md.
          # Render no ofrece workers gratuitos: este servicio es de pago. Alternativa sin costo fijo: no desplegarlo y ejecutar
          # `python -m app.worker --once` a mano o desde un Cron Job cuando se necesite (ver docs/ops/JOBS.md).
          - type: worker
            name: energyrd-worker-staging
            runtime: docker
            plan: starter
            region: virginia
            branch: Dev
            dockerfilePath: ./services/api/Dockerfile
            dockerContext: ./services/api
            dockerCommand: python -m app.worker
            autoDeployTrigger: commit
            envVars:
              - fromGroup: energyrd-api-staging-config
              - key: DATABASE_URL # el MISMO que la API de este entorno
                sync: false
              - key: AUTH_SIGNING_KEY # la config se valida igual en el worker; usar el mismo valor que la API
                sync: false
              - key: CORS_ORIGINS
                sync: false
              - key: RESEND_API_KEY # avisos por correo (alertas)
                sync: false
              - key: EMAIL_FROM
                sync: false
              - key: PASSWORD_RESET_URL # su origen es el enlace «/alerts» de los correos de aviso
                sync: false
              - key: EXPO_ACCESS_TOKEN # opcional: avisos push (Expo Push Service); vacío = sin token de acceso
                sync: false
              - key: STORAGE_S3_BUCKET
                sync: false
              - key: STORAGE_S3_ENDPOINT_URL # vacío = AWS S3; Cloudflare R2: https://<cuenta>.r2.cloudflarestorage.com
                sync: false
              - key: STORAGE_S3_ACCESS_KEY_ID
                sync: false
              - key: STORAGE_S3_SECRET_ACCESS_KEY
                sync: false
              - key: STORAGE_ENCRYPTION_KEYS # "id:clave" (base64url de 32 bytes); ver services/api/STORAGE.md
                sync: false
              - key: STORAGE_URL_SIGNING_KEY # ≥43 caracteres aleatorios
                sync: false

      # --------------------------------------------------------------- PRODUCTION
      - name: production
        envVarGroups:
          - name: energyrd-api-production-config
            envVars:
              - key: ENVIRONMENT
                value: production
              - key: AUTH_ENABLED
                value: "true"
              - key: MIGRATE_ON_START
                value: "false"
              - key: SEED_PILOT
                value: "false"
              - key: DB_POOL_SIZE
                value: "5"
              - key: DB_MAX_OVERFLOW
                value: "5"
              - key: DB_POOL_TIMEOUT
                value: "10"
              - key: EMAIL_BACKEND
                value: resend
              # ERD-STORE-01 / ERD-WORKER-01: originales de factura cifrados en un bucket S3-compatible PRIVADO.
              # Los secretos y el bucket van en cada servicio (sync: false); aquí solo lo no secreto.
              - key: STORAGE_BACKEND
                value: s3
        services:
          - type: web
            name: energyrd-api-prod
            runtime: docker
            plan: starter
            region: virginia
            branch: main
            dockerfilePath: ./services/api/Dockerfile
            dockerContext: ./services/api
            healthCheckPath: /health
            # Paso único de release: corre en una instancia aparte ANTES de enrutar tráfico a la
            # versión nueva. Si falla, el deploy se cancela y la versión anterior sigue sirviendo.
            # El ENTRYPOINT valida la configuración y luego ejecuta este comando (no arranca la API).
            preDeployCommand: alembic upgrade head
            autoDeployTrigger: "off"
            envVars:
              - fromGroup: energyrd-api-production-config
              - key: DATABASE_URL # Neon, rama principal (production), rol propio
                sync: false
              - key: AUTH_SIGNING_KEY
                sync: false
              - key: CORS_ORIGINS # https://<web-prod> (dominio propio o .onrender.com)
                sync: false
              - key: RESEND_API_KEY
                sync: false
              - key: EMAIL_FROM # p. ej. "Energy RD <no-reply@TU-DOMINIO>"
                sync: false
              - key: PASSWORD_RESET_URL
                sync: false
              - key: STORAGE_S3_BUCKET
                sync: false
              - key: STORAGE_S3_ENDPOINT_URL # vacío = AWS S3; Cloudflare R2: https://<cuenta>.r2.cloudflarestorage.com
                sync: false
              - key: STORAGE_S3_ACCESS_KEY_ID
                sync: false
              - key: STORAGE_S3_SECRET_ACCESS_KEY
                sync: false
              - key: STORAGE_ENCRYPTION_KEYS # "id:clave" (base64url de 32 bytes); ver services/api/STORAGE.md
                sync: false
              - key: STORAGE_URL_SIGNING_KEY # ≥43 caracteres aleatorios
                sync: false

          - type: web
            name: energyrd-web-prod
            runtime: node
            plan: starter
            region: virginia
            branch: main
            buildCommand: npm ci --include=dev && npm run build --workspace apps/web
            startCommand: npm run start --workspace apps/web
            healthCheckPath: /login
            autoDeployTrigger: "off"
            envVars:
              - key: NODE_VERSION
                value: "24"
              - key: NEXT_TELEMETRY_DISABLED
                value: "1"
              - key: NEXT_PUBLIC_AUTH_ENABLED
                value: "true"
              - key: API_BASE_URL
                sync: false
              - key: WEB_ORIGIN
                sync: false

          # ERD-WORKER-01: ejecuta los trabajos en segundo plano (OCR de originales, anomalías, alertas y avisos,
          # mantenimiento). La cola vive en PostgreSQL: mismo DATABASE_URL que la API. Docs: docs/ops/JOBS.md.
          - type: worker
            name: energyrd-worker-prod
            runtime: docker
            plan: starter
            region: virginia
            branch: main
            dockerfilePath: ./services/api/Dockerfile
            dockerContext: ./services/api
            dockerCommand: python -m app.worker
            autoDeployTrigger: "off"
            envVars:
              - fromGroup: energyrd-api-production-config
              - key: DATABASE_URL # el MISMO que la API de este entorno
                sync: false
              - key: AUTH_SIGNING_KEY # la config se valida igual en el worker; usar el mismo valor que la API
                sync: false
              - key: CORS_ORIGINS
                sync: false
              - key: RESEND_API_KEY # avisos por correo (alertas)
                sync: false
              - key: EMAIL_FROM
                sync: false
              - key: PASSWORD_RESET_URL # su origen es el enlace «/alerts» de los correos de aviso
                sync: false
              - key: EXPO_ACCESS_TOKEN # opcional: avisos push (Expo Push Service); vacío = sin token de acceso
                sync: false
              - key: STORAGE_S3_BUCKET
                sync: false
              - key: STORAGE_S3_ENDPOINT_URL # vacío = AWS S3; Cloudflare R2: https://<cuenta>.r2.cloudflarestorage.com
                sync: false
              - key: STORAGE_S3_ACCESS_KEY_ID
                sync: false
              - key: STORAGE_S3_SECRET_ACCESS_KEY
                sync: false
              - key: STORAGE_ENCRYPTION_KEYS # "id:clave" (base64url de 32 bytes); ver services/api/STORAGE.md
                sync: false
              - key: STORAGE_URL_SIGNING_KEY # ≥43 caracteres aleatorios
                sync: false
